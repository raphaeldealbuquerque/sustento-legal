<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sustento</title>
<meta name="description" content="Documentos legais do aplicativo Sustento.">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF5E6;--surface:#FFFFFF;--ink:#173F2B;--ink2:#4A5F52;--kraft:#D9BF93;--line:#E6DCC4}
@media (prefers-color-scheme:dark){:root{--bg:#101E16;--surface:#1A2B21;--ink:#F1E9D6;--ink2:#B5C2B8;--kraft:#D9BF93;--line:#2A3B31}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 24px;background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.6}
main{width:100%;max-width:460px}
.logo{display:block;margin:0 0 18px;color:var(--ink)}
h1{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:44px;letter-spacing:-.6px;line-height:1.1;margin:0 0 8px}
p{margin:0 0 28px;color:var(--ink2)}
a.doc{display:block;padding:16px 18px;margin:0 0 12px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none;font-weight:600}
a.doc span{display:block;font-weight:400;font-size:15px;color:var(--ink2)}
a.doc:hover{border-color:var(--ink)}
a.doc:focus-visible{outline:3px solid var(--kraft);outline-offset:3px}
</style>
</head>
<body>
<main>

<p>Sua lista de compras que aprende com as suas notinhas.</p>
